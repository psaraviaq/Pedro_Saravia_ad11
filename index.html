<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarjeta Personal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <button type="button" class="btn btn-primary">Primary</button>
      <button type="button" class="btn btn-success">Success</button>
      <button type="button" class="btn btn-warning">Warning</button>

      <p class="text-start">Izquierda</p>
      <p class="text-center text-danger">Centro</p>
      <p class="text-end">Derecha</p>

      <div class="card mt-4">
        <h2 class="card-header">Mi Perfil</h2>
        <img src="https://github.com/psaraviaq.png" class="card-img-top" alt="Mi perfil" />
        <ul class="list-group list-group-flush">
          <li class="list-group-item">Nombre: Pedro Saravia</li>
          <li class="list-group-item">Ciudad: Lima</li>
          <li class="list-group-item">Hobby: Leer cómics</li>
        </ul>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
